name: Deploy

# Only deploy after CI has passed on the target branch.
# This prevents broken commits from reaching Vercel while CI is still running.
on:
  workflow_run:
    workflows: [CI]
    branches: [main, staging]
    types: [completed]

env:
  NODE_VERSION: "20"

jobs:
  # ─── Deploy to Vercel ───────────────────────────────────────────────────────
  deploy:
    name: Deploy (${{ github.event.workflow_run.head_branch }})
    runs-on: ubuntu-latest
    # Only deploy when CI succeeded — skip on failure or cancellation.
    if: github.event.workflow_run.conclusion == 'success'
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        env:
          SENTRY_SUPPRESS_TURBOPACK_WARNING: 1
        run: |
          vercel build \
            ${{ github.event.workflow_run.head_branch == 'main' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy \
            --prebuilt \
            ${{ github.event.workflow_run.head_branch == 'main' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Run smoke test against deployment
        run: |
          # Wait for Vercel to propagate the deployment, then hit the health endpoint.
          sleep 15
          curl -f "${{ steps.deploy.outputs.url }}/api/health" \
            --retry 5 --retry-delay 5 \
            || (echo "Health check failed" && exit 1)

      # ─── Notify Sentry of new release ────────────────────────────────────
      - name: Create Sentry release
        if: github.event.workflow_run.head_branch == 'main'
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.event.workflow_run.head_sha }}
